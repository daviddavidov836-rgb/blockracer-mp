ro: turn the phone like a steering wheel. Tap the wheel bottom-left to set centre", "Гіроскоп: крути телефон як кермо. Тап по кермі внизу зліва — виставити центр"], "Датчики не отвечают. Открой игру по ссылке https (не файлом) и разреши «Датчики движения» в настройках сайта Chrome": ["Sensors aren’t responding. Open the game via an https link (not as a file) and allow “Motion sensors” in Chrome’s site settings", "Датчики не відповідають. Відкрий гру за посиланням https (не файлом) і дозволь «Датчики руху» в налаштуваннях сайту Chrome"], "Центр руля выставлен 🎯": ["Steering centre set 🎯", "Центр керма виставлено 🎯"], "ГИРОСКОП": ["GYRO", "ГІРОСКОП"], "тап — центр": ["tap = centre", "тап — центр"], "Скосы задают форму машины. Выбери «Скос» (или «Дуга», «Пирамида», «Внутр. скос»…), нажми 🔄 или R, чтобы повернуть, и «Наклон» (G), чтобы поставить его боком или вверх ногами — так делаются вертикальные скосы. «Крутить» и «Наклон» меняют уже поставленный блок.": ["Slopes shape the car. Pick “Slope” (or “Curve”, “Pyramid”, “Inner slope”…), press 🔄 or R to rotate it and “Tilt” (G) to stand it on its side or upside down — that is how vertical slopes are made. “Rotate” and “Tilt” change a block that is already placed.", "Скоси задають форму машини. Обери «Скіс» (або «Дуга», «Піраміда», «Внутр. скіс»…), натисни 🔄 або R, щоб повернути, і «Нахил» (G), щоб поставити його боком або догори дриґом — так робляться вертикальні скоси. «Крутити» і «Нахил» змінюють уже поставлений блок."], "Инструмент «Колесо»: тапни по колесу — задашь радиус и ширину, а кнопками ниже сдвинешь его внутрь, наружу, вперёд, назад, выше или ниже (шаг 0,05). Колесо ставится вплотную к блоку. Большие колёса — выше скорость, но слабее разгон; широкие — лучше сцепление. Жми «Далее».": ["“Wheel” tool: tap a wheel to set its radius and width, and use the buttons below to move it in, out, forward, back, up or down (0.05 step). Wheels snap flush to the block. Big wheels give top speed but weaker acceleration; wide one  в редакторе": ["No gearbox 🎚️ — add one in the editor", "Немає коробки 🎚️ — додай блок у редакторі"], "Автоматическая КПП": ["Automatic gearbox", "Автоматична КПП"], "Ручная КПП: E/Q или ▲▼": ["Manual gearbox: E/Q or ▲▼", "Ручна КПП: E/Q або ▲▼"], "АВТО": ["AUTO", "АВТО"], "РУЧН": ["MAN", "РУЧН"], "1 СТ": ["1 SPD", "1 СТ"], " бар": [" bar", " бар"], "нет": ["no", "немає"], "ОБУЧЕНИЕ · ШАГ ": ["TUTORIAL · STEP ", "НАВЧАННЯ · КРОК "], " ИЗ ": [" OF ", " З "], "\n⚠ Нужен режим «": ["\n⚠ Switch to «", "\n⚠ Потрібен режим «"], "🔧 Редактор": ["🔧 Editor", "🔧 Редактор"], "🏁 Ехать": ["🏁 Drive", "🏁 Їхати"], "Готово": ["Done", "Готово"], "Далее ▶": ["Next ▶", "Далі ▶"], "Обучение пройдено! 🎉 Повторить его можно в меню ☰": ["Tutorial complete! 🎉 Replay it from the ☰ menu", "Навчання пройдено! 🎉 Повторити можна в меню ☰"], "✓ Отлично!": ["✓ Great!", "✓ Чудово!"], "Редактор": ["Editor", "Редактор"], "Ехать": ["Drive", "Їхати"], "Сброс": ["Reset", "Скинути"], "Камера": ["Camera", "Камера"], "Трасса": ["Track", "Траса"], "📡 Лучи подвески": ["📡 Suspension rays", "📡 Промені підвіски"], "🔊 Звук": ["🔊 Sound", "🔊 Звук"], "Полный экран": ["Fullscreen", "Повний екран"], "❓ Обучение": ["❓ Tutorial", "❓ Навчання"], "Клиренс": ["Ride height", "Кліренс"], "ЦТ выше/ниже": ["CG up/down", "ЦТ вище/нижче"], "ЦТ вперёд/назад": ["CG front/back", "ЦТ вперед/назад"], "Жёсткость пружин": ["Spring stiffness", "Жорсткість пружин"], "Демпфер": ["Damper", "Демпфер"], "Макс. обороты": ["Rev limit", "Макс. оберти"], "Мощность 1 блока, л.с.": ["Power per block, hp", "Потужність 1 блока, к.с."], "Давление турбо, бар": ["Turbo pressure, bar", "Тиск турбо, бар"], "Пик тяги, % оборотов": ["Torque peak, % of revs", "Пік тяги, % обертів"], "Радиус": ["Radius", "Радіус"], "Ширина": ["Width", "Ширина"], "Блоки": ["Blocks", "Блоки"], "Инструменты": ["Tools", "Інструменти"], "Цвет": ["Color", "Колір"], "ТУРБО": ["TURBO", "ТУРБО"], "КМ/Ч": ["KM/H", "КМ/ГОД"], "Пропустить": ["Skip", "Пропустити"], "BlockRacer — песочница": ["BlockRacer — sandbox", "BlockRacer — пісочниця"], "Название": ["Name", "Назва"], "💾 Скачать файл .brcar": ["💾 Download .brcar file", "💾 Завантажити файл .brcar"], "📤 Отправить файлом": ["📤 Send as file", "📤 Надіслати файлом"], "📋 Копировать код": ["📋 Copy code", "📋 Копіювати код"], "Файл .brcar открывается только в BlockRacer: внутри сжатая и зашифрованная машина с настройками подвески, двигателя и привода. Код можно отправить сообщением — друг вставит его через «📥 Загрузить машину».": ["A .brcar file opens only in BlockRacer: it holds the compressed, encrypted car with suspension, engine and drive settings. You can also send the code as a message — a friend pastes it via “📥 Load car”.", "Файл .brcar відкривається лише в BlockRacer: усередині стиснута й зашифрована машина з налаштуваннями підвіски, двигуна та приводу. Код можна надіслати повідомленням — друг вставить його через «📥 Завантажити машину»."], "📂 Выбрать файл .brcar": ["📂 Choose .brcar file", "📂 Обрати файл .brcar"], "…или вставь код BRCAR1.…": ["…or paste a BRCAR1.… code", "…або встав код BRCAR1.…"], "✅ Загрузить код": ["✅ Load code", "✅ Завантажити код"], "Текущая машина заменится. Передумал — нажми «↶ Отмена» в редакторе.": ["Your current car will be replaced. Changed your mind? Press “↶ Undo” in the editor.", "Поточну машину буде замінено. Передумав — натисни «↶ Скасувати» в редакторі."], "Блоков": ["Blocks", "Блоків"], "мини": ["mini", "міні"], "Масса": ["Mass", "Маса"], "Моторов": ["Engines", "Моторів"], "л.с., до": ["hp, up to", "к.с., до"], "об/мин": ["rpm", "об/хв"], "Турбо": ["Turbo", "Турбо"], "КПП": ["Gearbox", "КПП"], "ст.": ["spd", "ст."], "Колёс": ["Wheels", "Коліс"], "двухколёсный": ["two-wheeler", "двоколісний"], "Привод": ["Drive", "Привід"], "ЦТ: высота": ["CG height", "ЦТ: висота"], "перед/зад": ["front/rear", "перед/зад"], "🟢 Зелёная сторона и стрелка = ПЕРЕД машины. Тап — действие, тяни — вращать, щипок/колесо — зум.": ["🟢 Green side and arrow = car FRONT. Tap — action, drag — rotate, pinch/wheel — zoom.", "🟢 Зелена сторона й стрілка = ПЕРЕД машини. Тап — дія, тягни — обертати, щипок/коліщатко — зум."], "🌐 Язык: Русский": ["🌐 Language: English", "🌐 Мова: Українська"], "высота кузова над дорогой": ["body height above the road", "висота кузова над дорогою"], "ниже — меньше крен": ["lower — less body roll", "нижче — менше крену"], "вперёд — стабильнее, назад — занос": ["front — more stable, back — more slide", "вперед — стабільніше, назад — занос"], "мягче — кочки, жёстче — повороты": ["softer — bumps, stiffer — corners", "м'якше — нерівності, жорсткіше — повороти"], "гасит раскачку": ["stops bouncing", "гасить розгойдування"], "выше — больше скорость на передаче": ["higher — more speed per gear", "вище — більша швидкість на передачі"], "л.с. каждого мотора": ["hp of each engine block", "к.с. кожного мотора"], "больше — мощнее, но турбояма": ["more — stronger, but more turbo lag", "більше — потужніше, але турбояма"], "меньше — тяга снизу, больше — верхи": ["lower — low-end pull, higher — top-end", "менше — тяга знизу, більше — верхи"], "больше — выше скорость, слабее разгон": ["bigger — higher top speed, slower launch", "більше — вища швидкість, слабший розгін"], "шире — больше сцепление": ["wider — more grip", "ширше — більше зчеплення"], "Добро пожаловать в гараж! Поверни машину: проведи пальцем по экрану. Два пальца — приблизить. Опусти камеру ниже пола — сможешь строить под машиной.": ["Welcome to the garage! Rotate the car: swipe the screen. Two fingers — zoom. Move the camera below the floor to build under the car.", "Ласкаво просимо в гараж! Поверни машину: проведи пальцем по екрану. Два пальці — наблизити. Опусти камеру нижче підлоги — зможеш будувати під машиною."], "Добро пожаловать в гараж! Поверни машину: зажми кнопку мыши и тяни. Колесо мыши — приблизить. Опусти камеру ниже пола — сможешь строить под машиной.": ["Welcome to the garage! Rotate the car: hold the mouse button and drag. Mouse wheel — zoom. Move the camera below the floor to build under the car.", "Ласкаво просимо в гараж! Поверни машину: затисни кнопку миші й тягни. Коліщатко — наблизити. Опусти камеру нижче підлоги — зможеш будувати під машиною."], "Поставь блок: тапни по машине или по площадке. Зелёный призрак показывает, где он появится. Цвет выбирается внизу панели.": ["Place a block: tap the car or the pad. The green ghost shows where it will appear. Pick the color at the bottom of the panel.", "Постав блок: тапни по машині або майданчику. Зелений привид показує, де він з'явиться. Колір обирається внизу панелі."], "Теперь удали блок: выбери «Удалять» и тапни по блоку.": ["Now delete a block: choose “Delete” and tap a block.", "Тепер видали блок: обери «Видаляти» і тапни по блоку."], "Сетка ½: включи «Сетка» — блоки станут вдвое меньше. Так строят мелкие детали, а колёса ставятся с шагом 0,5.": ["½ grid: switch on “Grid” — blocks become half size. Use it for small details; wheels snap in 0.5 steps.", "Сітка ½: увімкни «Сітка» — блоки стануть удвічі меншими. Так будують дрібні деталі, а колеса ставляться з кроком 0,5."], "«Симметрия» ставит и удаляет блоки сразу с двух сторон. Выключи её, если нужна несимметричная деталь. Жми «Далее».": ["“Mirror” places and deletes blocks on both sides at once. Turn it off for asymmetric parts. Press “Next”.", "«Симетрія» ставить і видаляє блоки одразу з двох боків. Вимкни її, якщо потрібна несиметрична деталь. Тисни «Далі»."], "⚙️ Мотор даёт мощность: каждый блок мотора добавляет лошадиные силы. Выбери «Мотор» и поставь ещё один.": ["⚙️ Engines give power: every engine block adds horsepower. Pick “Engine” and place one more.", "⚙️ Мотор дає потужність: кожен блок мотора додає кінські сили. Обери «Мотор» і постав ще один."], "🎚️ Коробка даёт 5 передач: машина быстрее разгоняется и выше максималка. Поставь её.": ["🎚️ A gearbox gives 5 gears: faster launch and higher top speed. Place one.", "🎚️ Коробка дає 5 передач: машина швидше розганяється і має вищу максималку. Постав її."], "🌀 Турбина добавляет мощность на высоких оборотах, но раскручивается с задержкой. 💨 Выхлоп — дым и хлопки, ставится в любую сторону. Жми «Далее».": ["🌀 A turbo adds power at high revs but spools up with a delay. 💨 Exhaust gives smoke and backfires, and can face any direction. Press “Next”.", "🌀 Турбіна додає потужність на високих обертах, але розкручується з затримкою. 💨 Вихлоп — дим і хлопки, ставиться в будь-який бік. Тисни «Далі»."], "Включи «Аэро» — новые блоки станут карбоновыми: в 2,5 раза легче и дают прижим на скорости. Машина лучше держит дорогу, но максималка чуть ниже.": ["Turn on “Aero” — new blocks become carbon: 2.5× lighter and they add downforce at speed. Better grip, slightly lower top speed.", "Увімкни «Аеро» — нові блоки стануть карбоновими: у 2,5 раза легші й дають притискну силу на швидкості. Краще тримає дорогу, але максималка трохи нижча."], "⚖️ Открой «Подвеска» и подвигай ползунок:\n• Клиренс — высота кузова над дорогой.\n• ЦТ выше/ниже — ниже = меньше кренов.\n• ЦТ вперёд/назад — вперёд = стабильнее, назад = легче занос.\n• Жёсткость — мягко для кочек, жёстко для поворотов.\n• Демпфер — гасит раскачку.": ["⚖️ Open “Suspension” and move a slider:\n• Ride height — body height above the road.\n• CG up/down — lower = less roll.\n• CG front/back — front = stable, back = slides easier.\n• Stiffness — soft for bumps, stiff for corners.\n• Damper — stops bouncing.", "⚖️ Відкрий «Підвіска» і посунь повзунок:\n• Кліренс — висота кузова над дорогою.\n• ЦТ вище/нижче — нижче = менше кренів.\n• ЦТ вперед/назад — вперед = стабільніше, назад = легший занос.\n• Жорсткість — м'яко для нерівностей, жорстко для поворотів.\n• Демпфер — гасить розгойдування."], "Открой «Двигатель»:\n• Макс. обороты — выше = больше скорость на каждой передаче.\n• Мощность 1 блока — сколько л.с. даёт каждый мотор.\n• Давление турбо — мощнее, но дольше раскручивается.\n• Пик тяги — меньше = тянет снизу, больше = крутится до отсечки.": ["Open “Engine”:\n• Rev limit — higher = more speed in every gear.\n• Power per block — hp of each engine.\n• Turbo pressure — stronger, but spools slower.\n• Torque peak — lower = low-end pull, higher = revs to the limiter.", "Відкрий «Двигун»:\n• Макс. оберти — вище = більша швидкість на кожній передачі.\n• Потужність 1 блока — скільки к.с. дає кожен мотор.\n• Тиск турбо — потужніше, але довше розкручується.\n• Пік тяги — менше = тягне знизу, більше = крутиться до відсічки."], "Привод — какие колёса толкают машину. Нажми кнопку привода:\n• Полный — лучший старт и устойчивость.\n• Задний — заносы на газу, для дрифта.\n• Передний — сам вытягивает из заноса.": ["Drive — which wheels push the car. Press the drive button:\n• AWD — best launch and stability.\n• RWD — slides on throttle, for drifting.\n• FWD — pulls itself out of slides.", "Привід — які колеса штовхають машину. Натисни кнопку приводу:\n• Повний — найкращий старт і стійкість.\n• Задній — заноси на газу, для дрифту.\n• Передній — сам витягує із заносу."], "Меню ☰ → «Поделиться машиной» сохраняет постройку в файл .brcar или код для друзей. «Загрузить машину» открывает чужие. Жми «Далее».": ["Menu ☰ → “Share car” saves your build as a .brcar file or a code for friends. “Load car” opens other people's builds. Press “Next”.", "Меню ☰ → «Поділитися машиною» зберігає збірку у файл .brcar або код для друзів. «Завантажити машину» відкриває чужі. Тисни «Далі»."], "Машина готова! Жми 🏁 Ехать.": ["The car is ready! Press 🏁 Drive.", "Машина готова! Тисни 🏁 Їхати."], "Газ — жёлтая педаль ГАЗ справа. Разгонись до 40 км/ч.": ["Throttle — the yellow GAS pedal on the right. Reach 40 km/h.", "Газ — жовта педаль ГАЗ праворуч. Розженися до 40 км/год."], "Газ — W или ↑. Разгонись до 40 км/ч.": ["Throttle — W or ↑. Reach 40 km/h.", "Газ — W або ↑. Розженися до 40 км/год."], "Поворачивай кнопками ◀ ▶ слева. Палец можно вести с кнопки на кнопку.": ["Steer with ◀ ▶ on the left. You can slide your finger between buttons.", "Повертай кнопками ◀ ▶ ліворуч. Палець можна вести з кнопки на кнопку."], "Поворачивай: A / D или ← →.": ["Steer: A / D or ← →.", "Повертай: A / D або ← →."], "Дрифт: удерживай ДРИФТ в повороте. С задним приводом занос держится газом, контрруль его гасит.": ["Drift: hold DRIFT in a turn. With RWD you keep the slide with throttle; countersteer ends it.", "Дрифт: утримуй ДРИФТ у повороті. Із заднім приводом занос тримається газом, контркермо його гасить."], "Дрифт: удерживай Пробел в повороте. С задним приводом занос держится газом, контрруль его гасит.": ["Drift: hold Space in a turn. With RWD you keep the slide with throttle; countersteer ends it.", "Дрифт: утримуй Пробіл у повороті. Із заднім приводом занос тримається газом, контркермо його гасить."], "Передачи: ▲ ▼ — вручную, тап по прибору — авто/ручной режим.": ["Gears: ▲ ▼ — manual, tap the gauges — auto/manual.", "Передачі: ▲ ▼ — вручну, тап по приладу — авто/ручний режим."], "Передачи: E / Q — вручную, T — авто/ручной режим.": ["Gears: E / Q — manual, T — auto/manual.", "Передачі: E / Q — вручну, T — авто/ручний режим."], "Смени камеру: кнопка 🎥 сверху — погоня, дальняя, с капота и свободная.": ["Switch the camera: the 🎥 button on top — chase, far, hood and free.", "Зміни камеру: кнопка 🎥 угорі — погоня, далека, з капота і вільна."], "Смени камеру: клавиша C — погоня, дальняя, с капота и свободная.": ["Switch the camera: key C — chase, far, hood and free.", "Зміни камеру: клавіша C — погоня, далека, з капота і вільна."], "Лучи подвески: меню ☰ → 📡 Лучи. Зелёный луч — колесо касается земли.": ["Suspension rays: menu ☰ → 📡 Rays. Green ray — the wheel touches the ground.", "Промені підвіски: меню ☰ → 📡 Промені. Зелений промінь — колесо торкається землі."], "Лучи подвески: клавиша V или меню ☰. Зелёный луч — колесо касается земли.": ["Suspension rays: key V or menu ☰. Green ray — the wheel touches the ground.", "Промені підвіски: клавіша V або меню ☰. Зелений промінь — колесо торкається землі."], "Разгонись и прыгни с жёлтого трамплина — он впереди, за буграми. Смотри, как работает подвеска!": ["Speed up and jump off the yellow ramp ahead, past the bumps. Watch the suspension work!", "Розженися й стрибни з жовтого трампліна — він попереду, за горбами. Дивись, як працює підвіска!"], "Кнопка 📍 «Трасса» переносит на тест-трек коллайдера и на горный серпантин с таймером круга. Попробуй!": ["The 📍 “Track” button takes you to the collider test track and the mountain serpentine with a lap timer. Try it!", "Кнопка 📍 «Траса» переносить на тест-трек колайдера та на гірський серпантин із таймером кола. Спробуй!"], "Готово! 🎉 ↺ Сброс (или R) — вернуться на старт, 🔧 Редактор — в гараж. Обучение можно повторить в меню ☰.": ["Done! 🎉 ↺ Reset (or R) — back to start, 🔧 Editor — to the garage. Replay the tutorial from the ☰ menu.", "Готово! 🎉 ↺ Скинути (або R) — назад на старт, 🔧 Редактор — у гараж. Навчання можна повторити в меню ☰."]};

 V.addEventListener('pointerdown',e=>{if(e.target!==V&&!e.target.classList.contains('whint'))return;drag={x:e.clientX,y:e.clientY};try{V.setPointerCapture(e.pointerId)}catch(x){}});
 V.addEventListener('pointermove',e=>{if(!drag)return;az-=(e.clientX-drag.x)*.008;el=Math.max(-1.3,Math.min(1.3,el+(e.clientY-drag.y)*.008));drag={x:e.clientX,y:e.clientY}});
 V.addEventListener('pointerup',()=>drag=null);V.addEventListener('dblclick',()=>{az=.75;el=.22;dist=2.6});
 V.addEventListener('wheel',e=>{e.preventDefault();dist=Math.max(1.2,Math.min(6,dist*(e.deltaY>0?1.1:.9)))},{passive:false});
 function key(e){if(typing(e.target))return;const c=e.ctrlKey||e.metaKey;
  if(c&&e.code=='KeyZ'){e.preventDefault();e.shiftKey?redo():undo()}else if(c&&e.code=='KeyY'){e.preventDefault();redo()}
  else if(c&&e.code=='KeyD'){e.preventDefault();dup(sel)}else if(c&&e.code=='KeyS'){e.preventDefault();save()}
  else if(e.code=='Delete'||e.code=='Backspace'){e.preventDefault();del(sel)}
  else if(e.code=='ArrowUp'||e.code=='ArrowDown'){e.preventDefault();if(w.parts.length){sel=Math.max(0,Math.min(w.parts.length-1,sel+(e.code=='ArrowUp'?-1:1)));need=true;ui()}}
  else if(e.code=='Escape'){if(sel>=0){sel=-1;need=true;ui()}else close()}}
 /* ---- экспорт / импорт: свой формат .brwheel ---- */
 const PFX='BRWHL1.',wfn=n=>(n.replace(/[^\wа-яА-ЯёЁ\- ]+/g,'').trim().replace(/\s+/g,'_')||'wheel')+'.brwheel';
 async function exportW(){save(true);const bytes=await BRC.enc({app:'BlockRacer',kind:'wheel',v:1,w:WG.clean(w)}),code=BRC.toText(bytes,PFX);
  dlgOpen(Lc('📤 Экспорт диска'),`<div class="dbtn"><button id="weXD">💾 ${H(Lc('Скачать файл .brwheel'))}</button><button id="weXC">📋 ${H(Lc('Копировать код'))}</button></div><textarea id="weXT" readonly rows="3"></textarea><div class="dn">${H(Lc('Файл .brwheel открывается только в BlockRacer. Друг загрузит его в редакторе дисков кнопкой «📥 Импорт».'))}</div>`);
  $('weXT').value=code;$('weXD').onclick=()=>{try{const u=URL.createObjectURL(new Blob([bytes],{type:'application/octet-stream'})),a=document.createElement('a');a.href=u;a.download=wfn(w.n);document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast(Lc('Файл сохранён: ')+wfn(w.n))}catch(e){toast(Lc('Не удалось скачать — используй «Копировать код»'))}};
  $('weXC').onclick=async()=>{let ok=false;try{await navigator.clipboard.writeText(code);ok=true}catch(e){}if(!ok){const t=$('weXT');t.focus();t.select();try{ok=document.execCommand('copy')}catch(e){}}toast(ok?Lc('Код скопирован 📋'):Lc('Выдели код и скопируй вручную'))}}
 async function take(u){const o=await BRC.dec(u);if(!o||o.kind!='wheel'||!o.w)throw new Error(Lc('Это не диск BlockRacer'));const x=WG.adopt(o.w);if(!x)throw new Error(Lc('Файл повреждён'));WG.put(x,true);if(dirty)save(true);load(x);dlgClose();toast(Lc('Диск «')+x.n+Lc('» загружен'));SND.ui('ok')}
 function importW(){dlgOpen(Lc('📥 Импорт диска'),`<div class="dbtn"><button id="weIF">📂 ${H(Lc('Выбрать файл .brwheel'))}</button></div><input id="weIFi" type="file" accept=".brwheel,.txt,application/octet-stream" style="display:none"><textarea id="weIT" rows="3" placeholder="${H(Lc('…или вставь код BRWHL1.…'))}"></textarea><div class="dbtn"><button id="weIL">✅ ${H(Lc('Загрузить код'))}</button></div>`);
  const fail=e=>{toast('⚠ '+(e&&e.message||Lc('Не удалось загрузить')));SND.ui('del')};
  $('weIF').onclick=()=>$('weIFi').click();$('weIFi').onchange=async()=>{const f=$('weIFi').files[0];if(!f)return;try{const u=new Uint8Array(await f.arrayBuffer());let t='';try{t=new TextDecoder().decode(u)}catch(x){}await take(t.trim().startsWith(PFX)?BRC.fromText(t,PFX):u)}catch(e){fail(e)}};
  $('weIL').onclick=async()=>{try{await take(BRC.fromText($('weIT').value,PFX))}catch(e){fail(e)}}}
 /* ---- открыть / закрыть / кадр ---- */
 function open(id){if(mode=='drive')setMode('edit');prev=mode;const s=typeof selW!='undefined'&&selW&&blocks.includes(selW)?selW:null,d=WG.get(id||(s&&s.dz)||'')||(WG.lib().slice(-1)[0])||WG.blank();
  load(d);mode='wheel';app.dataset.m='wheel';box.classList.add('open');need=true;SND.ui('toggle')}
 function close(){if(dirty||WG.inLib(w.id)||w.parts.length)save(true);box.classList.remove('open');mode='edit';app.dataset.m='edit';refresh();sync();SND.ui('click')}
 function tick(dt){if(need){need=false;if(wm)rot.remove(wm);wm=WG.mesh(w,.5,prevW);rot.add(wm);if(hl){rot.remove(hl);hl.geometry.dispose&&hl.geometry.dispose();hl=null}
   if(sel>=0&&w.parts[sel]){const B=WG.build(w,.5,prevW,[w.parts[sel]]),p=[];Object.values(B).forEach(b=>p.push(...b.p));if(p.length){const g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(p,3));hl=new T.Mesh(g,HLM);hl.renderOrder=5;rot.add(hl)}}}
  if(spin)ang+=dt*2;rot.rotation.x=ang;
  const Wd=$('view').clientWidth||1,Hd=$('view').clientHeight||1,L=box.querySelector&&box.querySelector('.wl'),Rr=box.querySelector&&box.querySelector('.wr'),lw=L&&L.getBoundingClientRect?L.getBoundingClientRect().width:0,rw=Rr&&Rr.getBoundingClientRect?Rr.getBoundingClientRect().width:0;
  cm.aspect=Wd/Hd;if(cm.setViewOffset)cm.setViewOffset(Wd,Hd,-(lw-rw)/2,0,Wd,Hd);const k=Math.max(1,1.25*(Wd/Math.max(200,Wd-lw-rw)));
  cm.position.set(Math.cos(el)*Math.cos(az)*dist*k,Math.sin(el)*dist*k,-Math.cos(el)*Math.sin(az)*dist*k);cm.lookAt(0,0,0);cm.updateProjectionMatrix()}
 return{key,open,close,tick,scene:sc,cam:cm,get w(){return w},add,undo,redo,save,load,exportW,importW,get sel(){return sel},set sel(v){sel=v;ui()}}})();

{const e=$('mWh');if(e)e.onclick=()=>{$('menu').classList.remove('open');WE.open()}}

 if(mode=='wheel'){WE.tick(dt);R.render(WE.scene,WE.cam);return}
 if(mode=='edit'){const lo=el<0,ty0=lo?.9:1.5;pad.material.opacity=lo?.18:1;pad.material.depthWrite=!lo;cam.position.set(Math.sin(az)*Math.cos(el)*dist,ty0+Math.sin(el)*dist,Math.cos(az)*Math.cos(el)*dist);cam.lookAt(0,ty0,0);
  cam.fov=55;cam.updateProjectionMatrix();arrow.position.z=7+Math.sin(now/250)*.35}
 else if(car)step(dt);
